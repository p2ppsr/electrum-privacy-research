name: Offline evidence verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-29
        with:
          persist-credentials: false
      - name: Reconstruct and verify retained evidence without live services
        env:
          RESEARCH_PYTHON: python3
        run: bash scripts/validate.sh
