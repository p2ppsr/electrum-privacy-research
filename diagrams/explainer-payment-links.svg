<svg id="explainer-payment-links" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 523.063px; background-color: rgb(255, 255, 255);" viewBox="0 -49 523.0634765625 359" role="img" aria-roledescription="flowchart-v2" aria-labelledby="explainer-payment-links-title explainer-payment-links-description"><title id="explainer-payment-links-title">Controlled payment example with fictional amounts and no real money</title><desc id="explainer-payment-links-description">Observed wallets A and B pay 2.5 million and 4 million test sats to a shop profile. An unidentified payer sends 1.25 million. The shop sends 1.1 million to an unidentified recipient.</desc><style>#explainer-payment-links{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#111111;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#explainer-payment-links .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#explainer-payment-links .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#explainer-payment-links .error-icon{fill:hsl(180, 0%, 100%);}#explainer-payment-links .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#explainer-payment-links .edge-thickness-normal{stroke-width:1px;}#explainer-payment-links .edge-thickness-thick{stroke-width:3.5px;}#explainer-payment-links .edge-pattern-solid{stroke-dasharray:0;}#explainer-payment-links .edge-thickness-invisible{stroke-width:0;fill:none;}#explainer-payment-links .edge-pattern-dashed{stroke-dasharray:3;}#explainer-payment-links .edge-pattern-dotted{stroke-dasharray:2;}#explainer-payment-links .marker{fill:#555555;stroke:#555555;}#explainer-payment-links .marker.cross{stroke:#555555;}#explainer-payment-links svg{font-family:Arial,Helvetica,sans-serif;font-size:18px;}#explainer-payment-links p{margin:0;}#explainer-payment-links .label{font-family:Arial,Helvetica,sans-serif;color:#111111;}#explainer-payment-links .cluster-label text{fill:rgb(0, 0, 0);}#explainer-payment-links .cluster-label span{color:rgb(0, 0, 0);}#explainer-payment-links .cluster-label span p{background-color:transparent;}#explainer-payment-links .label text,#explainer-payment-links span{fill:#111111;color:#111111;}#explainer-payment-links .node rect,#explainer-payment-links .node circle,#explainer-payment-links .node ellipse,#explainer-payment-links .node polygon,#explainer-payment-links .node path{fill:#f4f4f4;stroke:#666666;stroke-width:1px;}#explainer-payment-links .rough-node .label text,#explainer-payment-links .node .label text,#explainer-payment-links .image-shape .label,#explainer-payment-links .icon-shape .label{text-anchor:middle;}#explainer-payment-links .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#explainer-payment-links .rough-node .label,#explainer-payment-links .node .label,#explainer-payment-links .image-shape .label,#explainer-payment-links .icon-shape .label{text-align:center;}#explainer-payment-links .node.clickable{cursor:pointer;}#explainer-payment-links .root .anchor path{fill:#555555!important;stroke-width:0;stroke:#555555;}#explainer-payment-links .arrowheadPath{fill:#0b0b0b;}#explainer-payment-links .edgePath .path{stroke:#555555;stroke-width:2.0px;}#explainer-payment-links .flowchart-link{stroke:#555555;fill:none;}#explainer-payment-links .edgeLabel{background-color:#ffffff;text-align:center;}#explainer-payment-links .edgeLabel p{background-color:#ffffff;}#explainer-payment-links .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#explainer-payment-links .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#explainer-payment-links .cluster rect{fill:hsl(180, 0%, 100%);stroke:hsl(180, 0%, 90%);stroke-width:1px;}#explainer-payment-links .cluster text{fill:rgb(0, 0, 0);}#explainer-payment-links .cluster span{color:rgb(0, 0, 0);}#explainer-payment-links div.merma