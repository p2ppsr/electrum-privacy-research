<svg id="explainer-shop" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 553.672px; background-color: rgb(255, 255, 255);" viewBox="0 0 553.671875 507.0000305175781" role="img" aria-roledescription="flowchart-v2" aria-labelledby="explainer-shop-title explainer-shop-description"><title id="explainer-shop-title">How one checkout address identifies a wider shop profile</title><desc id="explainer-shop-description">The wallet sends fingerprints together. One matching checkout address labels the saved group as shop-associated. Other matching payments can then be linked.</desc><style>#explainer-shop{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#111111;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#explainer-shop .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#explainer-shop .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#explainer-shop .error-icon{fill:hsl(180, 0%, 100%);}#explainer-shop .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#explainer-shop .edge-thickness-normal{stroke-width:1px;}#explainer-shop .edge-thickness-thick{stroke-width:3.5px;}#explainer-shop .edge-pattern-solid{stroke-dasharray:0;}#explainer-shop .edge-thickness-invisible{stroke-width:0;fill:none;}#explainer-shop .edge-pattern-dashed{stroke-dasharray:3;}#explainer-shop .edge-pattern-dotted{stroke-dasharray:2;}#explainer-shop .marker{fill:#555555;stroke:#555555;}#explainer-shop .marker.cross{stroke:#555555;}#explainer-shop svg{font-family:Arial,Helvetica,sans-serif;font-size:18px;}#explainer-shop p{margin:0;}#explainer-shop .label{font-family:Arial,Helvetica,sans-serif;color:#111111;}#explainer-shop .cluster-label text{fill:rgb(0, 0, 0);}#explainer-shop .cluster-label span{color:rgb(0, 0, 0);}#explainer-shop .cluster-label span p{background-color:transparent;}#explainer-shop .label text,#explainer-shop span{fill:#111111;color:#111111;}#explainer-shop .node rect,#explainer-shop .node circle,#explainer-shop .node ellipse,#explainer-shop .node polygon,#explainer-shop .node path{fill:#f4f4f4;stroke:#666666;stroke-width:1px;}#explainer-shop .rough-node .label text,#explainer-shop .node .label text,#explainer-shop .image-shape .label,#explainer-shop .icon-shape .label{text-anchor:middle;}#explainer-shop .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#explainer-shop .rough-node .label,#explainer-shop .node .label,#explainer-shop .image-shape .label,#explainer-shop .icon-shape .label{text-align:center;}#explainer-shop .node.clickable{cursor:pointer;}#explainer-shop .root .anchor path{fill:#555555!important;stroke-width:0;stroke:#555555;}#explainer-shop .arrowheadPath{fill:#0b0b0b;}#explainer-shop .edgePath .path{stroke:#555555;stroke-width:2.0px;}#explainer-shop .flowchart-link{stroke:#555555;fill:none;}#explainer-shop .edgeLabel{background-color:#ffffff;text-align:center;}#explainer-shop .edgeLabel p{background-color:#ffffff;}#explainer-shop .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#explainer-shop .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#explainer-shop .cluster rect{fill:hsl(180, 0%, 100%);stroke:hsl(180, 0%, 90%);stroke-width:1px;}#explainer-shop .cluster text{fill:rgb(0, 0, 0);}#explainer-shop .cluster span{color:rgb(0, 0, 0);}#explainer-shop div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,Helvetica,sans-serif;font-size:12px;background:hsl(180, 0%, 100%);border:1px solid hsl(180, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#explainer-shop .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#111111;}#explainer-shop rect.text{fill:none;stroke-width:0;}#explainer-shop .icon-shape,#explainer-shop .image-shape{background-color:#ffffff;text-align:center;}#explainer-shop .icon-sha